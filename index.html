<script>
// ============================================================
//  SUPABASE
// ============================================================
const SUPABASE_URL = 'https://gyoytwbpvulzvljuwfis.supabase.co';
const SUPABASE_KEY = 'sb_publishable__2f2UEhPHE3d3cibhTga5w_NFmHWYZJ';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: 'supachat_auth' },
  realtime: { params: { eventsPerSecond: 20 } }
});

// ============================================================
//  STATE
// ============================================================
const state = {
  user: null, profile: null, chats: [], activeChat: null, messages: {},
  activeTab: 'all', activeSection: 'chats', searchQuery: '', replyTo: null,
  messageSubs: {}, globalSub: null, callSub: null,
  recording: false, recordingStart: 0,
  settings: { theme: localStorage.getItem('supachat_theme') || 'dark', enterToSend: true },
  currentCall: null, peerConnection: null, localStream: null, remoteStream: null,
  callChannel: null, isIncomingCall: false, iceAddedCount: 0,
  isMuted: false, isVideoEnabled: true, isFrontCamera: true,
  callTimerInterval: null, callSeconds: 0, callConnected: false,
  statusReactionChannel: null
};

// ============================================================
//  HELPERS
// ============================================================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, cls = 'w-5 h-5') => `<i data-lucide="${n}" class="${cls}"></i>`;
const refreshIcons = () => { try { window.lucide && lucide.createIcons(); } catch(e){} };

const AV_GRADIENTS = [
  'linear-gradient(135deg,#8b5cf6,#ec4899)', 'linear-gradient(135deg,#3478f6,#06b6d4)',
  'linear-gradient(135deg,#10b981,#06b6d4)', 'linear-gradient(135deg,#f59e0b,#ef4444)',
  'linear-gradient(135deg,#8b5cf6,#3478f6)', 'linear-gradient(135deg,#ec4899,#f43f5e)',
  'linear-gradient(135deg,#14b8a6,#06b6d4)', 'linear-gradient(135deg,#a855f7,#ec4899)'
];
const avGrad = (id) => {
  if (!id) return AV_GRADIENTS[0];
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return AV_GRADIENTS[Math.abs(hash) % AV_GRADIENTS.length];
};

function fmtTime(d) { try { return new Date(d).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }); } catch { return ''; } }
function fmtDay(d) {
  try {
    const date = new Date(d); const today = new Date(); today.setHours(0,0,0,0);
    const dd = new Date(date); dd.setHours(0,0,0,0);
    const diff = Math.floor((today - dd) / 86400000);
    if (diff === 0) return 'اليوم'; if (diff === 1) return 'أمس';
    if (diff < 7 && diff > 0) return date.toLocaleDateString('ar-EG', { weekday: 'long' });
    return date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
  } catch { return ''; }
}
function fmtDuration(sec) { sec = Math.max(0, Math.floor(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
function fmtLastSeen(d) {
  if (!d) return '';
  try {
    const diff = Math.floor((Date.now() - new Date(d)) / 60000);
    if (diff < 1) return 'الآن'; if (diff < 60) return `قبل ${diff} د`;
    const h = Math.floor(diff / 60); if (h < 24) return `قبل ${h} س`;
    const days = Math.floor(h / 24); if (days < 7) return `قبل ${days} ي`;
    return new Date(d).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
  } catch { return ''; }
}
function fmtBirthday(d) { if (!d) return ''; try { return new Date(d).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }); } catch { return ''; } }
function calcAge(d) {
  if (!d) return '';
  try {
    const bd = new Date(d); const today = new Date();
    let age = today.getFullYear() - bd.getFullYear();
    const m = today.getMonth() - bd.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < bd.getDate())) age--;
    return age;
  } catch { return ''; }
}
function toast(msg, type = 'info', duration = 3000) {
  const colors = { info: '#3478f6', success: '#10b981', error: '#ef4444', warning: '#f59e0b' };
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = colors[type] || colors.info;
  el.style.color = '#fff';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function applyTheme() {
  document.body.classList.toggle('dark', state.settings.theme === 'dark');

async function getMyProfile() {
  if (!state.user) return null;
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle();
  if (error) { console.warn('getMyProfile:', error); return null; }

}
async function getProfileById(userId) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if (error) { console.warn('getProfileById:', error); return null; }
  return data;
}
async function ensureProfile(user) {
  let profile = await getMyProfile();
  if (profile) return profile;
  await new Promise(r => setTimeout(r, 800));
  profile = await getMyProfile();
  if (profile) return profile;
  const username = (user.user_metadata?.username || user.email?.split('@')[0] || 'user_' + user.id.slice(0, 8)).replace(/[^a-zA-Z0-9_]/g, '_').toLowerCase();
  const fullName = user.user_metadata?.full_name || username;
  const { data, error } = await sb.from('profiles').insert({ id: user.id, username, full_name: fullName }).select().single();
  if (error) {
    if (error.code === '23505') { const p = await getMyProfile(); if (p) return p; }
    throw new Error('فشل إنشاء الملف: ' + error.message);
  }
  return data;
}
async function saveMyProfile(updates) {
  let current = await getMyProfile();
  if (!current) {
    const { data, error } = await sb.from('profiles').insert({
      id: state.user.id,
      username: state.profile?.username || 'user_' + state.user.id.slice(0, 8),
      full_name: updates.full_name || 'مستخدم', ...updates
    }).select().single();
    if (error) throw new Error('فشل الإنشاء: ' + error.message);
    return data;
  }
  if (updates.username && updates.username !== current.username) {
    const { data: taken } = await sb.from('profiles').select('id').eq('username', updates.username).neq('id', state.user.id).maybeSingle();
    if (taken) throw new Error('اسم المستخدم محجوز');
  }
  const { data, error } = await sb.from('profiles').update(updates).eq('id', state.user.id).select().single();
  if (error) {
    if (error.code === '23505') throw new Error('اسم المستخدم محجوز');
    if (error.code === '42501' || error.message.includes('permission')) throw new Error('لا تملك صلاحية التحديث');
    throw new Error('فشل: ' + error.message);
  }
  return data;
}

async function loadChats() {
  if (!state.user) return;
  const { data, error } = await sb.from('chat_members')
    .select(`chat_id, last_read_at, chats:chat_id (id, type, name, description, avatar_url, created_by, invite_link, created_at, updated_at)`)
    .eq('user_id', state.user.id);
  if (error) { console.error('loadChats:', error); return; }
  const chats = (data || []).map(row => row.chats).filter(Boolean);
  if (!chats.length) { state.chats = []; renderSidebarContent(); renderNavRail(); renderBottomNav(); return; }
  const chatIds = chats.map(c => c.id);
  const { data: membersData } = await sb.from('chat_members')
    .select(`chat_id, role, user_id, profiles:user_id (id, username, full_name, avatar_url, is_online, last_seen)`)
    .in('chat_id', chatIds);
  const membersByChat = {};
  (membersData || []).forEach(m => {
    if (!membersByChat[m.chat_id]) membersByChat[m.chat_id] = [];
    if (m.profiles) membersByChat[m.chat_id].push({ ...m.profiles, role: m.role });
  });
  const { data: lastMsgs } = await sb.from('messages')
    .select('chat_id, id, content, type, sender_id, is_deleted, created_at')
    .in('chat_id', chatIds).order('created_at', { ascending: false });
  const lastByChat = {};
  (lastMsgs || []).forEach(m => { if (!lastByChat[m.chat_id]) lastByChat[m.chat_id] = m; });
  const unreadByChat = {};
  const myMemberships = {};
  data.forEach(row => { myMemberships[row.chat_id] = row.last_read_at; });
  await Promise.all(chatIds.map(async chatId => {
    const lastRead = myMemberships[chatId] || '1970-01-01';
    const { count } = await sb.from('messages').select('id', { count: 'exact', head: true })
      .eq('chat_id', chatId).gt('created_at', lastRead).neq('sender_id', state.user.id);
    unreadByChat[chatId] = count || 0;
  }));
  state.chats = chats.map(c => ({
    ...c, members: membersByChat[c.id] || [],
    last_message: lastByChat[c.id] || null, unread: unreadByChat[c.id] || 0
  })).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  renderSidebarContent(); renderBottomNav(); renderNavRail();
}

async function loadMessages(chatId) {

  if (error) { console.error('loadMessages:', error); return; }

  if (msgIds.length) {
    const { data: rxns } = await sb.from('reactions').select('*').in('message_id', msgIds);
    (rxns || []).forEach(r => {
      if (!reactionsByMsg[r.message_id]) reactionsByMsg[r.message_id] = [];
      reactionsByMsg[r.message_id].push(r);

  state.messages[chatId] = (data || []).map(m => ({

}

  }).select().single();

async function uploadFile(file, bucket = 'chat-media') {
  const ext = file.name.split('.').pop() || 'bin';
  const path = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type });
  if (error) {
    if (error.message.includes('Bucket not found')) throw new Error(`المجلد "${bucket}" غير موجود`);
    if (error.message.includes('mime')) throw new Error('نوع الملف غير مدعوم');
    if (error.message.includes('size')) throw new Error('الملف كبير جداً');
    throw new Error(error.message);
  }
  const { data: urlData } = sb.storage.from(bucket).getPublicUrl(path);
  return urlData.publicUrl;
}

function subscribeGlobal() {
  if (state.globalSub) { try { state.globalSub.unsubscribe(); } catch(e){} }
  state.globalSub = sb.channel('global-updates')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, payload => {
      const u = payload.new;
      state.chats.forEach(c => {
        c.members?.forEach(m => { if (m.id === u.id) { m.is_online = u.is_online; m.last_seen = u.last_seen; } });
      });
      if (state.activeChat?.type === 'private') renderChatWindow();
      renderSidebarContent();
    }).subscribe();
}

function subscribeToChat(chatId) {
  if (state.messageSubs[chatId]) return;
  const ch = sb.channel(`chat:${chatId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, async (payload) => {
      const m = payload.new;
      const { data: sender } = await sb.from('profiles').select('id, username, full_name, avatar_url').eq('id', m.sender_id).maybeSingle();
      m.sender = sender; m.full_name = sender?.full_name; m.username = sender?.username; m.avatar_url = sender?.avatar_url; m.reactions = [];
      if (!state.messages[chatId]) state.messages[chatId] = [];
      if (!state.messages[chatId].some(x => x.id === m.id)) state.messages[chatId].push(m);
      if (state.activeChat?.id === chatId) renderMessages();
      loadChats(); playNotifSound();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, (payload) => {
      const m = payload.new;
      if (state.messages[chatId]) {
        const i = state.messages[chatId].findIndex(x => x.id === m.id);
        if (i > -1) {
          state.messages[chatId][i] = { ...state.messages[chatId][i], ...m };
          if (state.activeChat?.id === chatId) renderMessages();
        }
      }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reactions' }, (payload) => {
      const r = payload.new;
      for (const cid in state.messages) {
        const m = state.messages[cid].find(x => x.id === r.message_id);
        if (m && !m.reactions.some(x => x.id === r.id)) { m.reactions.push(r); if (state.activeChat?.id === cid) renderMessages(); }
      }
    }).subscribe();
  state.messageSubs[chatId] = ch;
}

function subscribeToCalls() {
  if (state.callSub) { try { state.callSub.unsubscribe(); } catch(e){} }
  state.callSub = sb.channel('incoming-calls-' + state.user.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: `receiver_id=eq.${state.user.id}` }, async (payload) => {
      const call = payload.new;
      if (call.status === 'ongoing' && !state.currentCall && !state.isIncomingCall) {
        const { data: caller } = await sb.from('profiles').select('id, full_name, username, avatar_url').eq('id', call.caller_id).maybeSingle();
        if (caller) showIncomingCall(call, caller);
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: `receiver_id=eq.${state.user.id}` }, (payload) => {
      const call = payload.new;
      if (state.currentCall?.id === call.id && call.ended_at) endCall(true);
    }).subscribe();
}

function playNotifSound() {
  if (document.hidden) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

async function boot() {

      state.user = session.user;
      try { state.profile = await ensureProfile(session.user); }
      catch (e) { console.error(e); toast('فشل تحميل الملف', 'error'); }
      await updateOnlineStatus(true);
      renderApp(); subscribeGlobal(); subscribeToCalls(); await loadChats(); startPresence();
      ensureFriendshipsForAll();
    } else { renderAuth(); }
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session && !state.user) {
        state.user = session.user;
        try {
          state.profile = await ensureProfile(session.user);
          await updateOnlineStatus(true);
          if (!$('#sidebar')) { renderApp(); subscribeGlobal(); subscribeToCalls(); await loadChats(); startPresence(); ensureFriendshipsForAll(); }
        } catch (e) { console.error(e); }
      } else if (event === 'SIGNED_OUT') { state.user = null; state.profile = null; renderAuth(); }
    });
  } catch (e) {
    console.error('Boot error:', e);
    document.body.innerHTML = `<div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0e1621; color: white; padding: 20px; text-align: center; direction: rtl; font-family: 'Cairo', sans-serif;"><div><div style="font-size: 48px; margin-bottom: 20px;">⚠️</div><h1 style="font-size: 20px; margin-bottom: 12px;">خطأ في الاتصال</h1><p style="opacity: 0.7; font-size: 14px; margin-bottom: 20px;">${esc(e.message)}</p><button onclick="location.reload()" style="padding: 10px 24px; border-radius: 10px; background: linear-gradient(135deg, #3478f6, #06b6d4); color: white; border: none; font-weight: 700; cursor: pointer; font-family: inherit;">إعادة المحاولة</button></div></div>`;
  }
}

            <span class="relative text-white text-4xl">💬</span>
          </div>
        </div>
        <h1 class="text-3xl font-black text-center text-white mb-1">SupaChat</h1>
        <p class="text-center text-white/50 mb-8 text-sm">منصة تواصل عصري • آمن • سريع</p>
        <div class="flex gap-2 mb-6 p-1 rounded-xl bg-white/5">
          <button id="tab-login" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white tab-active transition">دخول</button>
          <button id="tab-signup" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white/50 transition">حساب جديد</button>
        </div>
        <form id="auth-form" class="space-y-4">
          <div id="signup-fields" class="space-y-4 hidden">
            <input id="in-fullname" type="text" placeholder="الاسم الكامل" class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50" />
            <input id="in-username" type="text" placeholder="اسم المستخدم (إنجليزي)" class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50" />
          </div>
          <input id="in-email" type="email" placeholder="البريد الإلكتروني" required class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50" />
          <input id="in-password" type="password" placeholder="كلمة المرور" required minlength="6" class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-500/50" />
          <p id="auth-error" class="text-red-400 text-sm text-center hidden p-2 rounded-lg bg-red-500/10"></p>
          <p id="auth-info" class="text-blue-400 text-sm text-center hidden p-2 rounded-lg bg-blue-500/10"></p>
          <button type="submit" id="auth-submit" class="gradient-btn w-full py-3.5 rounded-xl text-white font-bold"><span id="auth-submit-text">تسجيل الدخول</span></button>
        </form>
        <p class="text-center text-white/30 text-xs mt-6">SupaChat v4.2</p>
      </div>
    </div>`;
  let mode = 'login';
  const setTab = (m) => {
    mode = m;
    $('#tab-login').className = 'flex-1 py-2.5 rounded-lg text-sm font-bold text-white transition ' + (m === 'login' ? 'tab-active' : 'text-white/50');
    $('#tab-signup').className = 'flex-1 py-2.5 rounded-lg text-sm font-bold text-white transition ' + (m === 'signup' ? 'tab-active' : 'text-white/50');
    $('#signup-fields').classList.toggle('hidden', m !== 'signup');
    $('#auth-submit-text').textContent = m === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
    $('#auth-error').classList.add('hidden'); $('#auth-info').classList.add('hidden');
  };
  $('#tab-login').onclick = () => setTab('login');
  $('#tab-signup').onclick = () => setTab('signup');
  const showError = (msg) => { $('#auth-error').textContent = msg; $('#auth-error').classList.remove('hidden'); $('#auth-info').classList.add('hidden'); };
  const showInfo = (msg) => { $('#auth-info').textContent = msg; $('#auth-info').classList.remove('hidden'); $('#auth-error').classList.add('hidden'); };
  $('#auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#in-email').value.trim();
    const pass = $('#in-password').value;
    const user = $('#in-username')?.value.trim();
    const full = $('#in-fullname')?.value.trim();
    $('#auth-error').classList.add('hidden'); $('#auth-info').classList.add('hidden');
    $('#auth-submit').disabled = true; $('#auth-submit-text').textContent = 'جارٍ...';
    try {
      if (mode === 'signup') {
        if (!user) throw new Error('اسم المستخدم مطلوب');
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(user)) throw new Error('اسم المستخدم: 3-20 حرف إنجليزي/رقم فقط');
        if (pass.length < 6) throw new Error('كلمة المرور 6 أحرف على الأقل');
        const result = await signUp(email, pass, user, full);
        if (result.session) {
          toast('أهلاً ' + (full || user), 'success');
          renderApp(); subscribeGlobal(); subscribeToCalls(); await loadChats(); startPresence(); ensureFriendshipsForAll();
        } else { showInfo('✓ تم إنشاء الحساب. تحقق من بريدك ثم سجّل الدخول.'); setTab('login'); }
      } else {
        if (!email || !pass) throw new Error('البريد وكلمة المرور مطلوبان');
        await signIn(email, pass);
        toast('أهلاً ' + state.profile?.full_name, 'success');
        renderApp(); subscribeGlobal(); subscribeToCalls(); await loadChats(); startPresence(); ensureFriendshipsForAll();
      }
    } catch (err) {
      let msg = err.message || 'حدث خطأ';
      if (msg.includes('Invalid login')) msg = 'البريد أو كلمة المرور غير صحيحة';
      if (msg.includes('Email not confirmed')) msg = 'يجب تفعيل بريدك أولاً';
      if (msg.includes('already registered')) msg = 'هذا البريد مسجّل مسبقاً';
      showError(msg);
    } finally {
      $('#auth-submit').disabled = false;
      $('#auth-submit-text').textContent = mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
    }
  };
}

function renderApp() {
  $('#root').innerHTML = `
    <div class="app-shell">
      <nav id="nav-rail" class="nav-rail"></nav>
      <aside id="sidebar" class="sidebar surface border-l border-soft"></aside>
      <main id="chat-window" class="chat-window hidden"></main>
      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>`;
  renderNavRail(); renderSidebar(); renderChatEmpty(); renderBottomNav();
}

function renderNavRail() {
  const rail = $('#nav-rail');
  if (!rail) return;
  const unreadTotal = state.chats.reduce((sum, c) => sum + (c.unread || 0), 0);
  const items = [
    { k: 'chats', label: 'الدردشات', icon: 'message-square', badge: unreadTotal },
    { k: 'stories', label: 'الحالات', icon: 'camera', badge: 0 },
    { k: 'friends', label: 'الأصدقاء', icon: 'users', badge: 0 },
    { k: 'calls', label: 'المكالمات', icon: 'phone', badge: 0 },
    { k: 'settings', label: 'الإعدادات', icon: 'settings', badge: 0 }
  ];
  rail.innerHTML = `
    <div class="w-12 h-12 rounded-2xl gradient-btn flex items-center justify-center text-white font-bold mb-2 flex-shrink-0 shadow-lg" style="font-size: 22px;">💬</div>
    ${items.map(it => `
      <div class="nav-rail-item ${state.activeSection === it.k ? 'active' : ''}" data-sec="${it.k}">
        ${icon(it.icon, 'w-6 h-6')}
        ${it.badge > 0 ? `<span class="rail-badge">${it.badge > 99 ? '99+' : it.badge}</span>` : ''}
        <span class="rail-label">${it.label}</span>
      </div>`).join('')}
    <div class="flex-1" style="min-height: 20px;"></div>
    <div class="nav-rail-item" id="rail-theme">${icon(state.settings.theme === 'dark' ? 'sun' : 'moon', 'w-6 h-6')}<span class="rail-label">${state.settings.theme === 'dark' ? 'نهاري' : 'ليلي'}</span></div>
    <div class="nav-rail-item" id="rail-profile">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold overflow-hidden" style="background: ${state.profile?.avatar_url ? 'transparent' : avGrad(state.user.id)};">
        ${state.profile?.avatar_url ? `<img src="${esc(state.profile.avatar_url)}" class="w-full h-full object-cover" />` : esc(state.profile?.full_name?.[0] || '?')}
      </div>
      <span class="rail-label">ملفي</span>
    </div>
    <div class="nav-rail-item" id="rail-logout">${icon('log-out', 'w-6 h-6')}<span class="rail-label">خروج</span></div>
  `;
  rail.querySelectorAll('.nav-rail-item[data-sec]').forEach(el => {
    el.onclick = () => { state.activeSection = el.dataset.sec; renderNavRail(); renderSidebarContent(); renderBottomNav(); };
  });
  $('#rail-theme').onclick = () => { toggleTheme(); renderNavRail(); renderSidebar(); };
  $('#rail-profile').onclick = () => openFullProfile(state.user.id);
  $('#rail-logout').onclick = doLogout;
  refreshIcons();
}

function renderSidebar() {
  const sbEl = $('#sidebar');
  const p = state.profile;
  const name = p?.full_name || 'أنا';
  sbEl.innerHTML = `
    <div class="p-3 flex items-center gap-3 border-b border-soft flex-shrink-0 glass">
      <button id="btn-profile" class="relative w-11 h-11 rounded-full flex-shrink-0 overflow-hidden flex items-center justify-center text-white font-bold shadow-md" style="background: ${p?.avatar_url ? 'transparent' : avGrad(state.user.id)};">
        ${p?.avatar_url ? `<img src="${esc(p.avatar_url)}" class="w-full h-full object-cover" />` : esc(name[0])}
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900 online-pulse"></span>
      </button>
      <div class="flex-1 min-w-0">
        <p class="text-primary font-bold text-sm truncate">${esc(name)}</p>
        <p class="text-emerald-500 text-xs">● متصل</p>
      </div>
      <button id="btn-theme" class="p-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 text-muted transition">${icon(state.settings.theme === 'dark' ? 'sun' : 'moon', 'w-5 h-5')}</button>
      <button id="btn-new-chat" class="p-2.5 rounded-xl gradient-btn text-white shadow-lg">${icon('plus', 'w-5 h-5')}</button>
    </div>
    <div id="sidebar-content" class="flex-1 flex flex-col overflow-hidden"></div>`;
  refreshIcons();
  $('#btn-theme').onclick = () => { toggleTheme(); renderSidebar(); renderNavRail(); };
  $('#btn-new-chat').onclick = openNewChatModal;
  $('#btn-profile').onclick = () => openFullProfile(state.user.id);
  renderSidebarContent();
}

function renderSidebarContent() {
  const c = $('#sidebar-content');
  if (!c) return;
  const s = state.activeSection;
  if (s === 'chats') renderChatsSection(c);
  else if (s === 'stories') renderStoriesSection(c);
  else if (s === 'friends') renderFriendsSection(c);
  else if (s === 'calls') renderCallsSection(c);
  else if (s === 'settings') renderSettingsSection(c);
  refreshIcons();
}

function renderChatsSection(container) {
  container.innerHTML = `
    <div class="p-3 flex-shrink-0">
      <div class="relative">
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-muted">${icon('search', 'w-4 h-4')}</span>
        <input id="search-input" type="text" placeholder="بحث..." class="w-full pr-10 pl-4 py-2.5 rounded-xl surface-2 border border-soft text-primary placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
      </div>
    </div>
    <div class="flex gap-1 px-3 pb-2 flex-shrink-0 overflow-x-auto">
      ${[{ k: 'all', label: 'الكل', icon: 'inbox' }, { k: 'private', label: 'دردشات', icon: 'user' }, { k: 'group', label: 'مجموعات', icon: 'users' }, { k: 'channel', label: 'قنوات', icon: 'radio' }, { k: 'unread', label: 'غير مقروء', icon: 'mail' }].map(t => `
        <button data-tab="${t.k}" class="ctab flex-shrink-0 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 transition ${state.activeTab === t.k ? 'tab-active' : 'text-muted hover:bg-black/5 dark:hover:bg-white/5'}">
          ${icon(t.icon, 'w-3.5 h-3.5')} ${t.label}
        </button>`).join('')}
    </div>
    <div id="chat-list" class="flex-1 overflow-y-auto"></div>`;
  $('#search-input').value = state.searchQuery;
  $('#search-input').oninput = (e) => { state.searchQuery = e.target.value.toLowerCase(); renderChatList(); };
  $$('.ctab').forEach(b => b.onclick = () => { state.activeTab = b.dataset.tab; renderSidebarContent(); });
  renderChatList();
}

function renderChatList() {
  const list = $('#chat-list');
  if (!list) return;
  const q = state.searchQuery;
  let filtered = state.chats.filter(c => {
    const o = getOther(c);
    const name = c.type === 'private' ? (o?.full_name || '') : (c.name || '');
    return name.toLowerCase().includes(q);
  });
  if (state.activeTab === 'unread') filtered = filtered.filter(c => c.unread > 0);
  else if (state.activeTab !== 'all') filtered = filtered.filter(c => c.type === state.activeTab);
  if (!filtered.length) {
    list.innerHTML = `<div class="flex flex-col items-center justify-center py-16 px-6 text-center"><div class="text-5xl mb-3 opacity-20">💬</div><p class="text-muted text-sm">لا توجد محادثات بعد</p><p class="text-muted text-xs mt-1 opacity-70">اضغط + للبدء</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(chatItemHTML).join('');
  filtered.forEach(c => {
    const el = list.querySelector(`[data-id="${c.id}"]`);
    if (el) {
      el.onclick = () => openChat(c.id);
      const avatar = el.querySelector('[data-avatar]');
      if (avatar) avatar.onclick = (e) => { e.stopPropagation(); const o = getOther(c); if (c.type === 'private' && o) openFullProfile(o.id); else { state.activeChat = c; renderChatWindow(); openChatInfo(); } };
    }
  });
  refreshIcons();
}

function getOther(c) { if (c.type !== 'private') return null; return c.members?.find(m => m.id !== state.user?.id) || null; }

function chatItemHTML(chat) {
  const isPrivate = chat.type === 'private';
  const o = getOther(chat);
  const name = isPrivate ? (o?.full_name || 'مستخدم') : (chat.name || 'بدون اسم');
  const avatar = isPrivate ? o?.avatar_url : chat.avatar_url;
  const isActive = state.activeChat?.id === chat.id;
  const isOnline = isPrivate && o?.is_online;
  const badge = chat.type === 'channel' ? '📢' : chat.type === 'group' ? '👥' : '';
  const unread = chat.unread || 0;
  const lastMsg = chat.last_message;
  const senderName = lastMsg && chat.type !== 'private' && lastMsg.sender_id !== state.user.id ? chat.members?.find(m => m.id === lastMsg.sender_id)?.full_name?.split(' ')[0] : null;
  let previewText = 'اضغط للفتح';
  if (lastMsg) {
    if (lastMsg.is_deleted) previewText = '🚫 رسالة محذوفة';
    else if (lastMsg.type === 'image') previewText = '🖼️ صورة';
    else if (lastMsg.type === 'video') previewText = '🎥 فيديو';
    else if (lastMsg.type === 'voice') previewText = '🎙️ رسالة صوتية';
    else if (lastMsg.type === 'audio') previewText = '🎵 صوت';
    else if (lastMsg.type === 'file') previewText = '📎 ملف';
    else previewText = lastMsg.content || '';
  }
  return `
    <div data-id="${chat.id}" class="chat-item w-full p-3 flex items-center gap-3 ${isActive ? 'active' : ''}">
      <div class="relative flex-shrink-0 cursor-pointer" data-avatar>
        <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold overflow-hidden shadow-sm" style="background: ${avatar ? 'transparent' : avGrad(isPrivate ? (o?.id || '') : chat.id)};">
          ${avatar ? `<img src="${esc(avatar)}" class="w-full h-full object-cover" loading="lazy" />` : esc(name[0])}
        </div>
        ${isOnline ? `<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900"></span>` : ''}
      </div>
      <div class="flex-1 text-right min-w-0">
        <div class="flex items-center justify-between gap-2">
          <p class="text-primary font-bold text-sm truncate">${badge} ${esc(name)}</p>
          ${lastMsg ? `<span class="text-muted text-[10px] flex-shrink-0">${fmtDay(lastMsg.created_at)}</span>` : ''}
        </div>
        <div class="flex items-center justify-between gap-2 mt-0.5">
          <p class="text-muted text-xs truncate flex-1">${senderName ? `<span class="font-bold">${esc(senderName)}: </span>` : ''}${esc(previewText.slice(0, 45))}</p>
          ${unread > 0 ? `<span class="bg-blue-500 text-white text-[10px] font-bold rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center">${unread > 99 ? '99+' : unread}</span>` : ''}
        </div>
      </div>
    </div>`;
}

//  STORIES
// ============================================================
async function renderStoriesSection(container) {
  container.innerHTML = `
    <div class="p-3 border-b border-soft flex items-center justify-between flex-shrink-0">
      <h3 class="text-primary font-bold text-lg">📸 الحالات</h3>
      <button id="btn-add-status" class="p-2 rounded-lg gradient-btn text-white">${icon('plus', 'w-4 h-4')}</button>
    </div>
    <div id="stories-body" class="flex-1 overflow-y-auto p-3">
      <div class="flex items-center justify-center py-8"><div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full spin"></div></div>
    </div>`;
  refreshIcons();
  $('#btn-add-status').onclick = openAddStatusModal;
  try {
    const [statuses, viewsMap] = await Promise.all([loadAllActiveStatuses(), loadStatusViews()]);
    const byUser = {};
    statuses.forEach(st => {
      const uid = st.user_id;
      if (!byUser[uid]) byUser[uid] = { user: st.profiles, statuses: [] };
      byUser[uid].statuses.push(st);
    });
    Object.values(byUser).forEach(item => item.statuses.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)));
    const myStatus = byUser[state.user.id];
    let others = Object.values(byUser).filter(x => x.user?.id !== state.user.id);
    others.sort((a, b) => {
      const aSeen = a.statuses.every(s => viewsMap[s.id]?.has(state.user.id));
      const bSeen = b.statuses.every(s => viewsMap[s.id]?.has(state.user.id));
      if (aSeen === bSeen) return 0;
      return aSeen ? 1 : -1;
    });
    container.querySelector('#stories-body').innerHTML = `
      <div class="flex items-center gap-2 mb-2">
        <button id="my-status-btn" class="flex-1 p-3 rounded-xl flex items-center gap-3 hover:bg-black/5 dark:hover:bg-white/5 transition text-right border border-soft">
          <div class="relative">
            ${myStatus ? `<div class="story-ring"><div class="w-14 h-14 rounded-full flex items-center justify-center text-white font-bold overflow-hidden border-2 border-white dark:border-slate-900" style="background: ${state.profile?.avatar_url ? 'transparent' : avGrad(state.user.id)};">${state.profile?.avatar_url ? `<img src="${esc(state.profile.avatar_url)}" class="w-full h-full object-cover" />` : esc(state.profile?.full_name?.[0] || '?')}</div></div>`
              : `<div class="w-14 h-14 rounded-full flex items-center justify-center text-white font-bold" style="background: ${state.profile?.avatar_url ? 'transparent' : avGrad(state.user.id)};">${state.profile?.avatar_url ? `<img src="${esc(state.profile.avatar_url)}" class="w-full h-full object-cover rounded-full" />` : esc(state.profile?.full_name?.[0] || '?')}</div>`}
            <span class="absolute bottom-0 right-0 w-5 h-5 rounded-full gradient-btn flex items-center justify-center border-2 border-white dark:border-slate-900">${icon('plus', 'w-3 h-3 text-white')}</span>
          </div>
          <div class="flex-1"><p class="text-primary font-bold text-sm">حالتي</p><p class="text-muted text-xs">${myStatus ? `${myStatus.statuses.length} تحديث` : 'أضف تحديثاً'}</p></div>
        </button>
        ${myStatus ? `<button id="delete-all-status" class="p-3 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 transition flex items-center justify-center" title="حذف كل حالاتي">
          ${icon('trash-2', 'w-5 h-5')}
        </button>` : ''}
      </div>
      ${others.length ? `<p class="text-muted text-xs font-bold pt-4 pb-1">التحديثات الأخيرة</p>${others.map(item => {
        const allSeen = item.statuses.every(s => viewsMap[s.id]?.has(state.user.id));
        return `<button data-story-uid="${item.user.id}" class="story-item w-full p-3 rounded-xl flex items-center gap-3 hover:bg-black/5 dark:hover:bg-white/5 transition text-right">
          <div class="${allSeen ? 'story-ring-seen' : 'story-ring'}"><div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold overflow-hidden border-2 border-white dark:border-slate-900" style="background: ${item.user.avatar_url ? 'transparent' : avGrad(item.user.id)};">${item.user.avatar_url ? `<img src="${esc(item.user.avatar_url)}" class="w-full h-full object-cover" />` : esc(item.user.full_name[0])}</div></div>
          <div class="flex-1 min-w-0"><p class="text-primary font-bold text-sm truncate">${esc(item.user.full_name)}</p><p class="text-muted text-xs">${item.statuses.length} تحديث</p></div>
        </button>`;
      }).join('')}` : `<div class="text-center py-6"><p class="text-muted text-xs">لا توجد تحديثات</p></div>`}
    `;
    refreshIcons();
    $('#my-status-btn').onclick = () => { if (myStatus) openStoryViewer(state.user.id); else openAddStatusModal(); };
    $('#delete-all-status')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`حذف جميع حالاتك (${myStatus.statuses.length})؟`)) return;
      try {
        await sb.from('statuses').delete().eq('user_id', state.user.id);
        toast('✅ تم حذف جميع الحالات', 'success');
        renderSidebarContent();
      } catch (err) { toast('فشل: ' + err.message, 'error'); }
    });
    $$('.story-item').forEach(b => b.onclick = () => openStoryViewer(b.dataset.storyUid));
  } catch (e) { console.error(e); }
}

// ============================================================
//  FRIENDS
// ============================================================
async function renderFriendsSection(container) {
  container.innerHTML = `
    <div class="p-3 border-b border-soft flex-shrink-0">
      <h3 class="text-primary font-bold text-lg mb-3">👥 الأصدقاء</h3>
      <div class="relative">
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-muted">${icon('search', 'w-4 h-4')}</span>
        <input id="friend-search" type="text" placeholder="ابحث بالاسم أو @يوزر..." class="w-full pr-10 pl-4 py-2.5 rounded-xl surface-2 border border-soft text-primary placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
      </div>
    </div>
    <div id="friends-list" class="flex-1 overflow-y-auto">
      <div class="flex items-center justify-center py-8"><div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full spin"></div></div>
    </div>`;
  refreshIcons();
  try {
    const [friends, allUsers] = await Promise.all([loadFriends(), searchUsersAll('')]);
    const users = friends.length ? friends : allUsers;
    renderFriendsList(users);
    const searchInput = $('#friend-search');
    const doSearch = debounce(async (q) => {
      const list = $('#friends-list');
      list.innerHTML = `<div class="flex items-center justify-center py-8"><div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full spin"></div></div>`;
      const base = friends.length ? friends : await searchUsersAll('');
      let results = base;
      if (q && q.trim()) {
        let term = q.trim();
        if (term.startsWith('@')) term = term.substring(1);
        term = term.toLowerCase();
        results = base.filter(u => (u.full_name || '').toLowerCase().includes(term) || (u.username || '').toLowerCase().includes(term));
      }
      renderFriendsList(results);
    }, 250);
    searchInput.oninput = () => doSearch(searchInput.value);
  } catch (e) { console.error('renderFriendsSection:', e); $('#friends-list').innerHTML = `<p class="text-center text-red-500 text-sm py-8">فشل التحميل</p>`; }
}

function renderFriendsList(users) {
  const list = $('#friends-list');
  if (!list) return;
  if (!users.length) {
    list.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-3 opacity-20">👥</div><p class="text-muted text-sm">لا أصدقاء بعد</p></div>`;
    return;
  }
  const sorted = [...users].sort((a, b) => {
    if (a.is_online !== b.is_online) return b.is_online ? 1 : -1;
    return (a.full_name || '').localeCompare(b.full_name || '', 'ar');
  });
  list.innerHTML = sorted.map(u => `
    <button data-uid="${u.id}" class="friend-item w-full p-3 flex items-center gap-3 hover:bg-black/5 dark:hover:bg-white/5 transition text-right">
      <div class="relative w-12 h-12 rounded-full flex items-center justify-center text-white font-bold overflow-hidden flex-shrink-0" style="background: ${u.avatar_url ? 'transparent' : avGrad(u.id)};">
        ${u.avatar_url ? `<img src="${esc(u.avatar_url)}" class="w-full h-full object-cover" loading="lazy" />` : esc((u.full_name || '?')[0])}
        ${u.is_online ? `<span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900"></span>` : ''}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-primary font-bold text-sm truncate">${esc(u.full_name)}</p>
        <p class="text-muted text-xs truncate">@${esc(u.username)} ${u.is_online ? '• 🟢 متصل' : '• ' + fmtLastSeen(u.last_seen)}</p>
      </div>
      <div class="flex gap-1">
        <button class="action-btn p-2 rounded-lg bg-blue-500/10 text-blue-500 hover:bg-blue-500/20" data-action="message" data-uid="${u.id}" title="رسالة">${icon('message-circle', 'w-4 h-4')}</button>
        <button class="action-btn p-2 rounded-lg bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20" data-action="call" data-uid="${u.id}" title="اتصال">${icon('phone', 'w-4 h-4')}</button>
        <button class="action-btn p-2 rounded-lg bg-purple-500/10 text-purple-500 hover:bg-purple-500/20" data-action="video" data-uid="${u.id}" title="فيديو">${icon('video', 'w-4 h-4')}</button>
      </div>
    </button>`).join('');
  list.querySelectorAll('.friend-item').forEach(el => {
    const uid = el.dataset.uid;
    el.onclick = (e) => {
      if (e.target.closest('.action-btn')) return;
      openFullProfile(uid);
    };
  });
  list.querySelectorAll('.action-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const uid = btn.dataset.uid;
      const action = btn.dataset.action;
      if (action === 'message') await startPrivateChat(uid);
      else if (action === 'call') initiateCall(uid, 'audio');
      else if (action === 'video') initiateCall(uid, 'video');
    };
  });
  refreshIcons();
}

async function openFullProfile(userId) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 z-[150] surface overflow-y-auto anim-slide';
  modal.innerHTML = `<div class="flex items-center justify-center py-12"><div class="w-8 h-8 border-4 border-blue-500/30 border-t-blue-500 rounded-full spin"></div></div>`;
  document.body.appendChild(modal);
  try {
    const profile = await getProfileById(userId);
    if (!profile) { modal.remove(); return toast('لم يتم العثور على المستخدم', 'error'); }
    const isMe = userId === state.user.id;
    const now = new Date().toISOString();
    const { data: statuses } = await sb.from('statuses').select('*').eq('user_id', userId).gt('expires_at', now).order('created_at', { ascending: false });
    let mutualChats = [];
    if (!isMe) {
      const { data: myMemberships } = await sb.from('chat_members').select('chat_id').eq('user_id', state.user.id);
      const myChatIds = (myMemberships || []).map(m => m.chat_id);
      if (myChatIds.length) {
        const { data: theirMemberships } = await sb.from('chat_members').select(`chat_id, chats:chat_id (id, type, name, avatar_url)`).eq('user_id', userId).in('chat_id', myChatIds);
        mutualChats = (theirMemberships || []).map(m => m.chats).filter(c => c && c.type !== 'private');
      }
      await ensureFriendship(userId);
    }
    const isOnline = profile.is_online;
    modal.innerHTML = `
      <div class="sticky top-0 z-10 glass border-b border-soft">
        <div class="flex items-center gap-3 p-3 max-w-2xl mx-auto">
          <button id="prof-back" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-muted">${icon('arrow-right', 'w-5 h-5')}</button>
          <h2 class="text-primary font-bold text-lg flex-1">الملف الشخصي</h2>
        </div>
      </div>
      <div class="max-w-2xl mx-auto pb-8">
        <div class="profile-hero" style="background: ${profile.avatar_url ? `linear-gradient(135deg, rgba(52,120,246,0.7), rgba(6,182,212,0.7)), url('${esc(profile.avatar_url)}') center/cover` : 'linear-gradient(135deg, #3478f6 0%, #06b6d4 100%)'};">
          <div class="flex items-end gap-4 w-full">
            <div class="profile-hero-avatar">${profile.avatar_url ? `<img src="${esc(profile.avatar_url)}" class="w-full h-full object-cover" />` : esc(profile.full_name[0])}</div>
            <div class="flex-1 min-w-0 pb-2">
              <h1 class="text-2xl font-bold truncate">${esc(profile.full_name)}</h1>
              <p class="text-white/80 text-sm">@${esc(profile.username)}</p>
              <p class="text-xs mt-1 ${isOnline ? 'text-emerald-300' : 'text-white/60'}">${isOnline ? '● متصل الآن' : 'آخر ظهور ' + fmtLastSeen(profile.last_seen)}</p>
            </div>
          </div>
        </div>
        ${!isMe ? `
          <div class="p-4 grid grid-cols-3 gap-2 border-b border-soft">
            <button id="prof-message" class="p-3 rounded-xl surface-2 border border-soft text-primary hover:bg-blue-500/10 transition flex flex-col items-center gap-1">${icon('message-circle', 'w-5 h-5 text-blue-500')}<span class="text-xs font-bold">رسالة</span></button>
            <button id="prof-call" class="p-3 rounded-xl surface-2 border border-soft text-primary hover:bg-emerald-500/10 transition flex flex-col items-center gap-1">${icon('phone', 'w-5 h-5 text-emerald-500')}<span class="text-xs font-bold">اتصال</span></button>
            <button id="prof-video" class="p-3 rounded-xl surface-2 border border-soft text-primary hover:bg-purple-500/10 transition flex flex-col items-center gap-1">${icon('video', 'w-5 h-5 text-purple-500')}<span class="text-xs font-bold">فيديو</span></button>
          </div>` : `
          <div class="p-4 border-b border-soft"><button id="prof-edit" class="w-full p-3 rounded-xl gradient-btn text-white font-bold">${icon('pencil', 'w-4 h-4 inline')} تعديل الملف الشخصي</button></div>`}
        <div class="p-4 space-y-4 border-b border-soft">
          ${profile.bio ? `<div><p class="text-muted text-xs font-bold mb-1">نبذة</p><p class="text-primary text-sm whitespace-pre-wrap">${esc(profile.bio)}</p></div>` : ''}
          ${profile.birthday ? `<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-pink-500/20 flex items-center justify-center text-pink-500">${icon('cake', 'w-5 h-5')}</div><div><p class="text-muted text-xs">تاريخ الميلاد</p><p class="text-primary text-sm font-medium">${fmtBirthday(profile.birthday)} ${calcAge(profile.birthday) ? '• ' + calcAge(profile.birthday) + ' سنة' : ''}</p></div></div>` : ''}
          ${profile.phone ? `<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-500">${icon('phone', 'w-5 h-5')}</div><div><p class="text-muted text-xs">الهاتف</p><p class="text-primary text-sm font-medium" dir="ltr">${esc(profile.phone)}</p></div></div>` : ''}
          ${profile.location ? `<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-500">${icon('map-pin', 'w-5 h-5')}</div><div><p class="text-muted text-xs">الموقع</p><p class="text-primary text-sm font-medium">${esc(profile.location)}</p></div></div>` : ''}
        </div>
        ${statuses?.length ? `<div class="p-4 border-b border-soft"><div class="flex items-center gap-2 mb-3">${icon('camera', 'w-5 h-5 text-pink-500')}<h3 class="text-primary font-bold">الحالات (${statuses.length})</h3></div><div class="flex gap-3 overflow-x-auto pb-2">
          ${statuses.map(st => `<button data-story-open="${st.id}" class="flex-shrink-0 w-20 h-28 rounded-xl overflow-hidden border-2 border-pink-500/30 hover:border-pink-500 transition" style="background: ${st.background_color || '#3478f6'};">
            ${st.type === 'image' && st.media_url ? `<img src="${esc(st.media_url)}" class="w-full h-full object-cover" />` : st.type === 'video' && st.media_url ? `<video src="${esc(st.media_url)}" class="w-full h-full object-cover"></video>` : `<div class="w-full h-full flex items-center justify-center p-2 text-white text-xs text-center">${esc((st.content || '').slice(0, 40))}</div>`}
          </button>`).join('')}
        </div></div>` : ''}
        ${mutualChats.length ? `<div class="p-4 border-b border-soft"><div class="flex items-center gap-2 mb-3">${icon('users', 'w-5 h-5 text-blue-500')}<h3 class="text-primary font-bold">${isMe ? 'المجموعات' : 'المجموعات المشتركة'} (${mutualChats.length})</h3></div><div class="space-y-1">
          ${mutualChats.slice(0, 10).map(c => `<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"><div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold overflow-hidden" style="background: ${c.avatar_url ? 'transparent' : avGrad(c.id)};">${c.avatar_url ? `<img src="${esc(c.avatar_url)}" class="w-full h-full object-cover" />` : esc((c.name || '?')[0])}</div><div class="flex-1 min-w-0"><p class="text-primary text-sm font-bold truncate">${esc(c.name || '')}</p><p class="text-muted text-xs">${c.type === 'channel' ? 'قناة' : 'مجموعة'}</p></div></div>`).join('')}
        </div></div>` : ''}
        <div class="p-4 text-center"><p class="text-muted text-xs">عضو منذ ${fmtBirthday(profile.created_at)}</p></div>
      </div>`;
    refreshIcons();
    $('#prof-back').onclick = () => modal.remove();
    if (!isMe) {
      $('#prof-message').onclick = async () => { modal.remove(); await startPrivateChat(userId); };
      $('#prof-call').onclick = () => { modal.remove(); initiateCall(userId, 'audio'); };
      $('#prof-video').onclick = () => { modal.remove(); initiateCall(userId, 'video'); };
    } else {
      $('#prof-edit').onclick = () => { modal.remove(); openProfileModal(); };
    }
    modal.querySelectorAll('[data-story-open]').forEach(b => b.onclick = () => { modal.remove(); openStoryViewer(userId); });
  } catch (e) {
    console.error('openFullProfile:', e);
    modal.remove();
    toast('فشل تحميل الملف: ' + e.message, 'error');
  }
}

function renderBottomNav() {
  const nav = $('#bottom-nav');
  if (!nav) return;
  const unreadTotal = state.chats.reduce((sum, c) => sum + (c.unread || 0), 0);
  const items = [
    { k: 'chats', label: 'الدردشات', icon: 'message-square', badge: unreadTotal },
    { k: 'stories', label: 'الحالات', icon: 'camera', badge: 0 },
    { k: 'friends', label: 'الأصدقاء', icon: 'users', badge: 0 },
    { k: 'calls', label: 'المكالمات', icon: 'phone', badge: 0 },
    { k: 'settings', label: 'الإعدادات', icon: 'settings', badge: 0 }
  ];
  nav.innerHTML = items.map(it => `
    <div class="bottom-nav-item ${state.activeSection === it.k ? 'active' : ''}" data-sec="${it.k}">
      <span class="relative">${icon(it.icon, 'w-6 h-6')}${it.badge > 0 ? `<span class="badge">${it.badge > 99 ? '99+' : it.badge}</span>` : ''}</span>
      <span>${it.label}</span>
    </div>`).join('');
  nav.querySelectorAll('.bottom-nav-item').forEach(el => el.onclick = () => {
    if (window.innerWidth < 768 && state.activeChat) {
      $('#chat-window')?.classList.add('hidden'); $('#chat-window')?.classList.remove('flex');
      $('#sidebar')?.classList.remove('hidden-mobile'); state.activeChat = null;

    state.activeSection = el.dataset.sec;
    renderBottomNav(); renderSidebarContent(); renderNavRail();
  });
  refreshIcons();
}

function renderChatEmpty() {

async function openChat(chatId) {
  const chat = state.chats.find(c => c.id === chatId);
  if (!chat) return;
  state.activeChat = chat;
  if (window.innerWidth < 768) {
    $('#sidebar')?.classList.add('hidden-mobile');
    $('#chat-window')?.classList.remove('hidden');
    $('#chat-window')?.classList.add('flex');
  } else {
    $('#chat-window')?.classList.remove('hidden');
  }
  renderChatWindow();
  await loadMessages(chatId);
  renderMessages();
  subscribeToChat(chatId);
  renderChatList();
}

      <div class="flex items-end gap-1.5">
        <button id="btn-emoji" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 text-muted flex-shrink-0">${icon('smile', 'w-5 h-5')}</button>
        <button id="btn-attach" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 text-muted flex-shrink-0">${icon('paperclip', 'w-5 h-5')}</button>

  $('#chat-info-btn').onclick = openChatInfo;
  $('#chat-menu-btn').onclick = openChatMenu;
  $('#btn-call').onclick = () => startCall('audio');
  $('#btn-video').onclick = () => startCall('video');
  const input = $('#msg-input');
  const sendBtn = $('#btn-send');
  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 128) + 'px'; sendBtn.disabled = !input.value.trim(); };
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && state.settings.enterToSend) { e.preventDefault(); doSend(); } };
  sendBtn.onclick = doSend;
  $('#btn-emoji').onclick = toggleEmoji;
  $('#btn-attach').onclick = () => $('#file-input').click();
  $('#btn-mic').onclick = startVoiceRecording;
  $('#file-input').onchange = (e) => { const f = e.target.files?.[0]; if (f) handleFileUpload(f); e.target.value = ''; };
}

async function doSend() {
  const input = $('#msg-input');
  const content = input.value.trim();
  if (!content || !state.activeChat) return;
  input.value = ''; input.style.height = 'auto';
  $('#btn-send').disabled = true;
  try {
    await sendMessage(state.activeChat.id, content, 'text', null, { replyTo: state.replyTo });
    state.replyTo = null; clearReplyPreview();
    await loadMessages(state.activeChat.id);
    renderMessages(); await loadChats();
  } catch (e) { toast(e.message || 'فشل الإرسال', 'error'); }
}

function clearReplyPreview() { const rp = $('#reply-preview'); if (rp) { rp.classList.add('hidden'); rp.innerHTML = ''; } }

async function handleFileUpload(file) {
  const MAX_MB = 100;
  if (file.size / (1024 * 1024) > MAX_MB) return toast(`حجم كبير (حد ${MAX_MB}MB)`, 'error');
  const isVideo = file.type.startsWith('video/');
  let duration = null;
  if (isVideo) {
    try { duration = await getVideoDuration(file); if (duration > 65) return toast(`الفيديو طويل (${Math.round(duration)}ث)`, 'error'); } catch (e) {}
  }
  showUploadProgress(isVideo ? 'رفع الفيديو...' : 'رفع...');
  updateUploadProgress(20);
  try {
    const url = await uploadFile(file, 'chat-media');
    updateUploadProgress(90);
    let type = 'file';
    if (file.type.startsWith('image/')) type = 'image';
    else if (file.type.startsWith('video/')) type = 'video';
    else if (file.type.startsWith('audio/')) type = 'audio';
    await sendMessage(state.activeChat.id, file.name, type, url, { replyTo: state.replyTo, duration: duration ? Math.round(duration) : null });
    updateUploadProgress(100);
    state.replyTo = null; clearReplyPreview();
    await loadMessages(state.activeChat.id);
    renderMessages(); await loadChats();
    toast('تم ✓', 'success');
  } catch (e) { console.error(e); toast(e.message, 'error'); }
  finally { setTimeout(hideUploadProgress, 500); }
}

function getVideoDuration(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    const url = URL.createObjectURL(file);
    v.src = url;
    v.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror = () => { URL.revokeObjectURL(url); reject(new Error('فشل')); };
    setTimeout(() => reject(new Error('timeout')), 10000);
  });
}

function startVoiceRecording() {
  if (state.recording) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    sendMessage(state.activeChat.id, '🎙️ رسالة صوتية', 'voice', null, { duration: 5 }).then(() => { loadMessages(state.activeChat.id); renderMessages(); });
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const file = new File([blob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
      const duration = Math.floor((Date.now() - state.recordingStart) / 1000);
      showUploadProgress('رفع الصوت...');
      try {
        const url = await uploadFile(file, 'chat-media');
        await sendMessage(state.activeChat.id, 'رسالة صوتية', 'voice', url, { duration });
        state.replyTo = null; clearReplyPreview();
        await loadMessages(state.activeChat.id);
        renderMessages(); await loadChats();
      } catch (e) { toast('فشل الرفع', 'error'); }
      finally { hideUploadProgress(); }
    };
    recorder.start();
    state.recording = true;
    state.recordingStart = Date.now();
    const btn = $('#btn-mic');
    btn.classList.add('bg-red-500', 'text-white');
    btn.innerHTML = `<span class="pulse-mic w-5 h-5 rounded-full bg-white/40"></span>`;
    toast('🎙️ جاري التسجيل... اضغط للإرسال', 'info');
    btn.onclick = () => {
      recorder.stop();
      state.recording = false;
      btn.classList.remove('bg-red-500', 'text-white');
      btn.innerHTML = icon('mic', 'w-5 h-5');
      btn.onclick = startVoiceRecording;
    };
  }).catch(e => toast('لا يمكن الوصول للميكروفون', 'error'));
}

function renderMessages() {
  const area = $('#messages');
  if (!area || !state.activeChat) return;
  const list = state.messages[state.activeChat.id] || [];
  if (!list.length) {
    area.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center"><div class="text-4xl mb-3 opacity-20">👋</div><p class="text-muted text-sm">ابدأ المحادثة الآن</p></div>`;
    return;
  }
  let html = '', lastDay = '', lastSender = '';
  list.forEach(m => {
    const day = fmtDay(m.created_at);
    if (day !== lastDay) {
      html += `<div class="flex justify-center my-3"><span class="px-3 py-1 rounded-full surface-2 text-muted text-xs font-semibold">${day}</span></div>`;
      lastDay = day; lastSender = '';
    }
    const isMine = m.sender_id === state.user.id;
    const showAvatar = !isMine && m.sender_id !== lastSender;
    html += messageHTML(m, isMine, showAvatar);
    lastSender = m.sender_id;
  });
  area.innerHTML = html;
  $$('.msg-wrapper', area).forEach(w => {
    const id = w.dataset.id;
    const msg = list.find(m => m.id === id);
    if (!msg || msg.is_deleted) return;
    w.ondblclick = (e) => { e.preventDefault(); showMessageMenu(msg, w); };
    w.oncontextmenu = (e) => { e.preventDefault(); showMessageMenu(msg, w); };
  });
  $$('[data-media-open]', area).forEach(el => {
    el.onclick = (e) => {
      e.preventDefault();
      const msgId = el.dataset.mediaOpen;
      const msg = list.find(m => m.id === msgId);
      openMediaViewer(el.dataset.mediaUrl, el.dataset.mediaType, msg?.content);
    };
  });
  $$('[data-avatar-open]', area).forEach(el => {
    el.onclick = () => { const uid = el.dataset.avatarOpen; if (uid) openFullProfile(uid); };
  });
  setTimeout(() => area.scrollTop = area.scrollHeight, 50);
  refreshIcons();
}

    content = `<img src="${esc(m.media_url)}" class="rounded-lg mb-1 max-w-full max-h-80 object-cover cursor-pointer" data-media-open="${m.id}" data-media-url="${esc(m.media_url)}" data-media-type="image" loading="lazy" />`;

    content = `<div class="flex items-center gap-2 py-1 min-w-[180px]"><audio src="${esc(m.media_url)}" controls style="max-width:220px"></audio>${m.media_duration ? `<span class="text-xs opacity-70 font-bold">${fmtDuration(m.media_duration)}</span>` : ''}</div>`;
  } else if (m.type === 'voice') {
    content = `<div class="flex items-center gap-2 py-1">${icon('mic', 'w-4 h-4')}<span class="text-sm">${esc(m.content || 'رسالة صوتية')}</span></div>`;

function showMessageMenu(msg, wrapper) {
  $$('.msg-menu').forEach(m => m.remove());
  const isMine = msg.sender_id === state.user.id;
  const emojis = ['❤️','👍','😂','😮','😢','🔥','🎉','👏','🙏','💯'];
  const menu = document.createElement('div');
  menu.className = 'msg-menu context-menu surface border border-soft anim-pop';
  menu.innerHTML = `
    <div class="p-2 border-b border-soft"><div class="flex gap-0.5 flex-wrap justify-center max-w-[260px]">${emojis.map(e => `<button data-emoji="${e}" class="text-2xl p-1 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 hover:scale-125 transition">${e}</button>`).join('')}</div></div>
    <div class="p-1">
      <button data-act="reply" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-primary flex items-center gap-3 text-sm font-medium">${icon('reply', 'w-4 h-4')} رد</button>
      ${isMine && msg.type === 'text' && !msg.is_deleted ? `<button data-act="edit" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-primary flex items-center gap-3 text-sm font-medium">${icon('pencil', 'w-4 h-4')} تعديل</button>` : ''}
      ${msg.content && !msg.is_deleted ? `<button data-act="copy" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-primary flex items-center gap-3 text-sm font-medium">${icon('copy', 'w-4 h-4')} نسخ</button>` : ''}
      ${msg.media_url ? `<button data-act="download" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-primary flex items-center gap-3 text-sm font-medium">${icon('download', 'w-4 h-4')} حفظ</button>` : ''}
      ${isMine ? `<button data-act="delete" class="w-full p-2.5 rounded-lg hover:bg-red-500/10 text-red-500 flex items-center gap-3 text-sm font-medium">${icon('trash-2', 'w-4 h-4')} حذف</button>` : ''}
    </div>`;
  const rect = wrapper.getBoundingClientRect();
  const w = 260, h = 420;
  let top = rect.bottom + 5;
  if (top + h > window.innerHeight) top = Math.max(10, rect.top - h - 5);
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(10, Math.min(window.innerWidth - w - 10, left));
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  document.body.appendChild(menu);
  refreshIcons();
  menu.querySelectorAll('[data-emoji]').forEach(b => b.onclick = async () => { await toggleReaction(msg.id, b.dataset.emoji); setTimeout(() => { loadMessages(state.activeChat.id).then(renderMessages); }, 300); menu.remove(); });
  menu.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    menu.remove();
    if (act === 'delete') { if (!confirm('حذف الرسالة؟')) return; await deleteMessage(msg.id); await loadMessages(state.activeChat.id); renderMessages(); toast('تم الحذف ✓', 'success'); }
    else if (act === 'edit') { const t = prompt('عدّل:', msg.content); if (t && t !== msg.content) { await editMessage(msg.id, t); await loadMessages(state.activeChat.id); renderMessages(); toast('تم التعديل ✓', 'success'); } }
    else if (act === 'copy') { navigator.clipboard.writeText(msg.content || '').then(() => toast('تم النسخ ✓', 'success')); }
    else if (act === 'download') { downloadMedia(msg.media_url, msg.content || 'file'); }
    else if (act === 'reply') {
      state.replyTo = msg.id;
      const rp = $('#reply-preview');
      rp.classList.remove('hidden');
      const sender = msg.sender_id === state.user.id ? 'أنت' : msg.full_name;
      rp.innerHTML = `<div class="flex items-center gap-2"><div class="flex-1 min-w-0"><p class="text-blue-500 text-xs font-bold">↩ ${esc(sender)}</p><p class="text-muted text-xs truncate">${esc((msg.content || '📎 مرفق').slice(0, 60))}</p></div><button id="cancel-reply" class="p-1 text-muted hover:text-red-500">${icon('x', 'w-4 h-4')}</button></div>`;
      $('#cancel-reply').onclick = () => { state.replyTo = null; clearReplyPreview(); };
      refreshIcons();
      $('#msg-input').focus();
    }
  });
  setTimeout(() => { const close = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } }; document.addEventListener('click', close); }, 100);
}

  $('#mv-external').onclick = () => window.open(url, '_blank');

async function downloadMedia(url, filename) {
  try {
    toast('جارٍ التحميل...', 'info');
    const response = await fetch(url);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl; a.download = filename || 'download';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
    toast('تم التحميل ✓', 'success');
  } catch (e) { console.error('download:', e); window.open(url, '_blank'); }
}

async function getUserMediaSafe(type) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('متصفحك لا يدعم الوصول للكاميرا والميكروفون');
  }
  const constraints = {
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, channelCount: 1 },
    video: type === 'video' ? { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, facingMode: state.isFrontCamera ? 'user' : 'environment', frameRate: { ideal: 30, max: 60 } } : false
  };
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    return stream;
  } catch (err) {
    console.error('getUserMedia failed:', err.name, err.message);
    let msg = 'فشل الوصول للكاميرا والميكروفون';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      msg = '⚠️ يجب السماح بالوصول\n\n1. اضغط على أيقونة القفل بجانب الرابط\n2. اختر "السماح" للكاميرا والميكروفون\n3. أعد المحاولة';
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      msg = 'لم يتم العثور على كاميرا أو ميكروفون';
    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
      msg = 'الكاميرا/الميكروفون مستخدمة من تطبيق آخر';
    } else if (err.name === 'OverconstrainedError') {
      try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
      catch (e2) { msg = 'جودة الكاميرا غير مدعومة'; }
    }
    throw new Error(msg);
  }
}

async function initiateCall(userId, type) {
  if (state.currentCall) return toast('هناك مكالمة جارية', 'warning');
  const { data: other } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (!other) return;
  const { data: callRec, error } = await sb.from('calls').insert({
    caller_id: state.user.id, receiver_id: userId,
    type, status: 'ongoing', started_at: new Date().toISOString()
  }).select().single();
  if (error) { console.error('call error:', error); return toast('فشل بدء المكالمة', 'error'); }
  state.currentCall = { ...callRec, other, isCaller: true, type };
  await startWebRTC(callRec, other, type, true);
  showCallScreen(other, type, true);
}

async function startWebRTC(callRec, other, type, isCaller) {
  try {
    state.localStream = await getUserMediaSafe(type);
    state.peerConnection = new RTCPeerConnection(ICE_SERVERS);
    state.remoteStream = new MediaStream();
    state.iceAddedCount = 0;
    state.localStream.getTracks().forEach(track => state.peerConnection.addTrack(track, state.localStream));
    state.peerConnection.ontrack = (event) => {
      if (!state.remoteStream.getTracks().some(t => t.id === event.track.id)) state.remoteStream.addTrack(event.track);
      attachRemoteStream();
    };
    state.peerConnection.oniceconnectionstatechange = () => {
      const st = state.peerConnection?.iceConnectionState;
      if (st === 'connected' || st === 'completed') {
        state.callConnected = true;
        const statusEl = $('#call-status-text');
        if (statusEl) statusEl.textContent = 'متصل';
        startCallTimer();
      }
    };
    state.peerConnection.onconnectionstatechange = () => {
      const st = state.peerConnection?.connectionState;
      if (st === 'connected') {
        state.callConnected = true;
        const statusEl = $('#call-status-text');
        if (statusEl) statusEl.textContent = 'متصل';
        startCallTimer();
      }
    };
    state.peerConnection.onicecandidate = async (event) => {
      if (event.candidate) {
        const field = isCaller ? 'caller_ice' : 'receiver_ice';
        try {
          const { data: existing } = await sb.from('calls').select(field).eq('id', callRec.id).single();
          const currentIce = existing?.[field] || [];
          await sb.from('calls').update({ [field]: [...currentIce, event.candidate.toJSON()] }).eq('id', callRec.id);
        } catch (e) { console.warn('ICE save:', e); }
      }
    };
    subscribeToCallUpdates(callRec.id, isCaller);
    if (isCaller) {
      const offer = await state.peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: type === 'video' });
      await state.peerConnection.setLocalDescription(offer);
      await sb.from('calls').update({ offer: offer }).eq('id', callRec.id);
    }
  } catch (e) {
    console.error('startWebRTC:', e);
    toast(e.message, 'error', 5000);
    setTimeout(() => endCall(true), 1500);
  }
}

function attachRemoteStream() {
  if (!state.remoteStream) return;
  const remoteVideo = $('#call-remote-video');
  if (remoteVideo && remoteVideo.srcObject !== state.remoteStream) { remoteVideo.srcObject = state.remoteStream; remoteVideo.play().catch(() => {}); }
  const remoteVideoSmall = $('#call-remote-video-small');
  if (remoteVideoSmall && remoteVideoSmall.srcObject !== state.remoteStream) { remoteVideoSmall.srcObject = state.remoteStream; remoteVideoSmall.play().catch(() => {}); }
}

function subscribeToCallUpdates(callId, isCaller) {
  if (state.callChannel) { try { state.callChannel.unsubscribe(); } catch(e){} }
  state.callChannel = sb.channel('call-' + callId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: `id=eq.${callId}` }, async (payload) => {
      const call = payload.new;
      if (call.ended_at && state.currentCall?.id === call.id) { endCall(true); return; }
      if (!state.peerConnection) return;
      if (isCaller && call.answer && !state.peerConnection.currentRemoteDescription) {
        try {
          await state.peerConnection.setRemoteDescription(new RTCSessionDescription(call.answer));
          const receiverIce = call.receiver_ice || [];
          for (const ice of receiverIce) { try { await state.peerConnection.addIceCandidate(new RTCIceCandidate(ice)); } catch (e) {} }
          state.iceAddedCount = receiverIce.length;
        } catch (e) { console.warn('setRemote answer:', e); }
      }
      if (!isCaller && call.offer && !state.peerConnection.currentRemoteDescription) {
        try {
          await state.peerConnection.setRemoteDescription(new RTCSessionDescription(call.offer));
          const answer = await state.peerConnection.createAnswer();
          await state.peerConnection.setLocalDescription(answer);
          await sb.from('calls').update({ answer: answer, accepted_at: new Date().toISOString() }).eq('id', callId);
          const callerIce = call.caller_ice || [];
          for (const ice of callerIce) { try { await state.peerConnection.addIceCandidate(new RTCIceCandidate(ice)); } catch (e) {} }
          state.iceAddedCount = callerIce.length;
        } catch (e) { console.warn('answer error:', e); }
      }
      if (state.peerConnection && state.peerConnection.currentRemoteDescription) {
        const remoteIce = isCaller ? (call.receiver_ice || []) : (call.caller_ice || []);
        for (let i = state.iceAddedCount || 0; i < remoteIce.length; i++) {
          try { await state.peerConnection.addIceCandidate(new RTCIceCandidate(remoteIce[i])); } catch (e) {}
        }
        state.iceAddedCount = remoteIce.length;
      }
    }).subscribe();
}

function startCallTimer() {
  if (state.callTimerInterval) return;
  state.callSeconds = 0;
  state.callTimerInterval = setInterval(() => {
    state.callSeconds++;
    const el = $('#call-timer');
    if (el) el.textContent = fmtDuration(state.callSeconds);
  }, 1000);
}

      const newState = !videoTracks[0].enabled;
      videoTracks.forEach(t => t.enabled = newState);
      state.isVideoEnabled = newState;

      if (!state.localStream) return;
      try {
        state.isFrontCamera = !state.isFrontCamera;
        const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: state.isFrontCamera ? 'user' : 'environment' }, audio: false });
        const newVideoTrack = newStream.getVideoTracks()[0];
        if (state.peerConnection) {
          const sender = state.peerConnection.getSenders().find(s => s.track?.kind === 'video');
          if (sender) await sender.replaceTrack(newVideoTrack);
        }
        const oldVideoTrack = state.localStream.getVideoTracks()[0];
        if (oldVideoTrack) { oldVideoTrack.stop(); state.localStream.removeTrack(oldVideoTrack); }
        state.localStream.addTrack(newVideoTrack);
        const localVideo = $('#call-local-video');

  const btnVideoEnable = $('#btn-video-enable');

    btnVideoEnable.onclick = async () => {
      if (!state.peerConnection || !state.localStream) return;
      try {
        if (state.localStream.getVideoTracks().length > 0) {
          const vt = state.localStream.getVideoTracks()[0];
          vt.enabled = !vt.enabled;
          btnVideoEnable.classList.toggle('active', !vt.enabled);
          btnVideoEnable.querySelector('.call-btn-label').textContent = vt.enabled ? 'فيديو' : 'موقوف';
        } else {
          const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
          const vt = newStream.getVideoTracks()[0];
          state.peerConnection.addTrack(vt, newStream);
          state.localStream.addTrack(vt);

        }
      } catch (e) { console.error(e); toast('فشل تفعيل الفيديو: ' + e.message, 'error'); }
    };
  }
}

async function endCall(silent = false) {
  try {
    if (state.callTimerInterval) { clearInterval(state.callTimerInterval); state.callTimerInterval = null; }
    if (state.callChannel) { try { state.callChannel.unsubscribe(); } catch(e){} state.callChannel = null; }
    if (state.peerConnection) {
      try { state.peerConnection.getSenders().forEach(s => { try { s.track?.stop(); } catch(e){} }); } catch(e){}
      state.peerConnection.close();
      state.peerConnection = null;
    }
    if (state.localStream) { state.localStream.getTracks().forEach(t => { try { t.stop(); } catch(e){} }); state.localStream = null; }
    state.remoteStream = null;
    state.iceAddedCount = 0;
    state.callConnected = false;
    state.callSeconds = 0;
    if (state.currentCall && !silent) {
      await sb.from('calls').update({ ended_at: new Date().toISOString(), status: 'answered' }).eq('id', state.currentCall.id);
    }
    state.currentCall = null;
    const screen = $('#call-screen');
    if (screen) screen.remove();
    if (!silent) toast('انتهت المكالمة', 'info');
  } catch (e) { console.error('endCall:', e); }
}

function showIncomingCall(call, caller) {
  if ($('.incoming-call-screen')) return;
  state.isIncomingCall = true;
  const overlay = document.createElement('div');
  overlay.className = 'incoming-call-screen';
  overlay.innerHTML = `
    <div class="text-center">
      <p class="text-white/60 text-sm mb-2">${call.type === 'video' ? '📹 مكالمة فيديو واردة' : '📞 مكالمة صوتية واردة'}</p>
      <div class="w-32 h-32 rounded-full flex items-center justify-center text-white text-5xl font-bold overflow-hidden mx-auto shadow-2xl ring-shake" style="background: ${caller.avatar_url ? 'transparent' : avGrad(caller.id)};">
        ${caller.avatar_url ? `<img src="${esc(caller.avatar_url)}" class="w-full h-full object-cover" />` : esc(caller.full_name[0])}
      </div>
      <h2 class="text-2xl font-bold mt-4">${esc(caller.full_name)}</h2>
      <p class="text-white/60 text-sm mt-1">@${esc(caller.username)}</p>
    </div>
    <div class="flex gap-8">
      <button id="in-decline" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center shadow-2xl">${icon('phone-off', 'w-7 h-7')}</button>
      <button id="in-accept" class="w-16 h-16 rounded-full bg-emerald-500 flex items-center justify-center shadow-2xl ring-shake">${icon('phone', 'w-7 h-7')}</button>
    </div>`;
  document.body.appendChild(overlay);
  refreshIcons();
  let ringCtx, ringOsc, ringInt;
  try {
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const playRing = () => {
      ringOsc = ringCtx.createOscillator();
      const gain = ringCtx.createGain();
      ringOsc.frequency.value = 400;
      gain.gain.setValueAtTime(0.15, ringCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1);
      ringOsc.connect(gain).connect(ringCtx.destination);
      ringOsc.start(); ringOsc.stop(ringCtx.currentTime + 1);
    };
    playRing();
    ringInt = setInterval(playRing, 2000);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 500]);
  const cleanup = () => {
    try { if (ringInt) clearInterval(ringInt); ringOsc?.stop(); ringCtx?.close(); } catch(e){}
    if (navigator.vibrate) navigator.vibrate(0);
    overlay.remove();
    state.isIncomingCall = false;
  };
  $('#in-accept').onclick = async () => {
    cleanup();
    state.currentCall = { ...call, other: caller, isCaller: false, type: call.type };
    await startWebRTC(call, caller, call.type, false);
    showCallScreen(caller, call.type, false);
  };
  $('#in-decline').onclick = async () => {
    cleanup();
    await sb.from('calls').update({ status: 'declined', ended_at: new Date().toISOString() }).eq('id', call.id);
  };
  setTimeout(() => {
    if (overlay.parentNode && !state.currentCall) {
      sb.from('calls').select('status, ended_at').eq('id', call.id).maybeSingle().then(({ data }) => {
        if (data && (data.status === 'declined' || data.ended_at)) cleanup();
      });
    }
  }, 45000);
}

    $('#extra-fields', modal).classList.toggle('hidden', mode === 'private');
    $('#create-wrap', modal).classList.toggle('hidden', mode === 'private');
  });
  function renderUsers(users) {
    const list = $('#ulist', modal);
    if (!users.length) { list.innerHTML = `<p class="text-center text-muted py-8 text-sm">لا نتائج</p>`; return; }
    list.innerHTML = users.map(u => `
      <button data-uid="${u.id}" class="urow w-full p-3 rounded-xl flex items-center gap-3 hover:bg-black/5 dark:hover:bg-white/5 transition ${selected.has(u.id) ? 'bg-blue-500/10' : ''}">

        ${selected.has(u.id) ? `<span class="text-blue-500">${icon('check', 'w-5 h-5')}</span>` : ''}
      </button>`).join('');
    list.querySelectorAll('.urow').forEach(row => row.onclick = () => {
      const uid = row.dataset.uid;
      if (mode === 'private') { modal.remove(); startPrivateChat(uid); return; }
      if (selected.has(uid)) selected.delete(uid); else selected.add(uid);
      updateBtn(); renderUsers(users);
    });
    refreshIcons();
  }
  function updateBtn() { const name = $('#cname', modal).value.trim(); $('#btn-create', modal).disabled = !name || selected.size === 0; }
  $('#cname', modal).oninput = updateBtn;
  const search = $('#usearch', modal);
  const doSearch = debounce(async (q) => {
    const list = $('#ulist', modal);
    list.innerHTML = `<div class="flex items-center justify-center py-8"><div class="w-6 h-6 border-4 border-blue-500/30 border-t-blue-500 rounded-full spin"></div></div>`;
    try { const results = await searchUsersAll(q); renderUsers(results); }
    catch (e) { list.innerHTML = `<p class="text-center text-red-500 text-sm py-8">فشل البحث</p>`; }
  }, 250);
  search.oninput = () => doSearch(search.value);
  doSearch('');
  $('#btn-create', modal).onclick = async () => {
    const name = $('#cname', modal).value.trim();
    const desc = $('#cdesc', modal).value.trim();
    if (!name || selected.size === 0) return;
    const btn = $('#btn-create', modal);
    btn.disabled = true; btn.textContent = 'جارٍ الإنشاء...';
    try {
      const chat = await createGroupOrChannel(mode, name, desc, [...selected]);
      modal.remove(); await loadChats();
      state.activeSection = 'chats'; renderBottomNav(); renderNavRail();
      openChat(chat.id);
      toast('تم الإنشاء ✓', 'success');
    } catch (e) { console.error(e); toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'إنشاء'; }
  };
}

      toast('تم الحفظ ✓', 'success');
