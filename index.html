      renderSidebar(); renderNavRail(); await loadChats();
    } catch (e) { console.error('save:', e); toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'حفظ'; }
  };
}

    b.classList.remove('border-transparent'); b.classList.add('border-blue-500');
    selectedBg = b.dataset.bg;

    $('#media-fields', modal).classList.toggle('hidden', stType === 'text');
  });
  $('#st-pick', modal).onclick = () => $('#st-file', modal).click();
  $('#st-file', modal).onchange = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    mediaFile = f;
    const preview = $('#st-preview', modal);
    preview.classList.remove('hidden');
    if (f.type.startsWith('image/')) {
      const url = URL.createObjectURL(f);
      preview.innerHTML = `<img src="${url}" class="w-full rounded-xl max-h-48 object-cover" />`;
    } else {
      preview.innerHTML = `<div class="p-3 rounded-xl surface-2 flex items-center gap-2">${icon('video', 'w-6 h-6 text-blue-500')}<span class="text-primary text-sm font-bold truncate">${esc(f.name)}</span></div>`;
    }
  };

    const btn = $('#st-publish', modal);
    btn.disabled = true; btn.textContent = 'جارٍ النشر...';
    try {
      let media_url = null, type = 'text', content = '';
      if (stType === 'text') {
        content = $('#st-text', modal).value.trim();
        if (!content) throw new Error('اكتب شيئاً');
      } else {
        if (!mediaFile) throw new Error('اختر ملفاً');
        if (stType === 'video') {
          const duration = await getVideoDuration(mediaFile).catch(() => null);
          if (duration && duration > 65) throw new Error(`الفيديو طويل (${Math.round(duration)}ث) - الحد 60 ثانية`);
        }
        showUploadProgress('رفع الحالة...');
        media_url = await uploadFile(mediaFile, 'status-media');
        type = stType;
        content = $('#st-caption', modal).value.trim();
      }
      await publishStatus({ type, content, media_url, background_color: stType === 'text' ? selectedBg : null });
      modal.remove();
      toast('✅ تم نشر الحالة', 'success');
      if (state.activeSection === 'stories') renderSidebarContent();
      else { state.activeSection = 'stories'; renderBottomNav(); renderNavRail(); renderSidebarContent(); }
    } catch (e) { console.error('publishStatus:', e); toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'نشر الحالة'; }
    finally { hideUploadProgress(); }
  };
}

      <div class="absolute bottom-4 left-3 right-3 flex items-center gap-2 z-20">
        <input id="story-reply" type="text" placeholder="أرسل رسالة..." class="flex-1 px-4 py-3 rounded-full bg-white/10 backdrop-blur text-white placeholder-white/50 text-sm focus:outline-none border border-white/20" />
        <button id="story-send" class="p-3 rounded-full bg-blue-500 text-white">${icon('send', 'w-5 h-5')}</button>
      </div>
    </div>`;
  document.body.appendChild(viewer);
  refreshIcons();
  for (const st of statuses) await markStatusSeen(st.id);
  
  let idx = 0, timer = null, paused = false, remainingTime = 5000, pausedAt = 0;
  const progressEls = viewer.querySelectorAll('[data-prog]');
  
  function show(i) {
    clearTimeout(timer);
    if (i < 0) i = 0;
    if (i >= statuses.length) return close();
    idx = i; paused = false;
    const st = statuses[idx];
    const contentEl = $('#story-content', viewer);
    if (st.type === 'text' || !st.media_url) {
      contentEl.style.background = st.background_color || 'linear-gradient(135deg,#3478f6,#06b6d4)';
      contentEl.innerHTML = `<div class="anim-fade">${esc(st.content || '').replace(/\n/g, '<br>')}</div>`;
    } else if (st.type === 'image') {
      contentEl.style.background = '#000';
      contentEl.innerHTML = `<img src="${esc(st.media_url)}" class="max-w-full max-h-full object-contain anim-fade" />`;
    } else if (st.type === 'video') {
      contentEl.style.background = '#000';
      contentEl.innerHTML = `<video src="${esc(st.media_url)}" autoplay playsinline class="max-w-full max-h-full anim-fade"></video>`;
    }
    $('#story-time', viewer).textContent = fmtLastSeen(st.created_at);
    progressEls.forEach((el, k) => { el.style.transitionDuration = '0ms'; el.style.width = k < idx ? '100%' : '0%'; });
    const dur = st.type === 'video' ? 15000 : 5000;
    remainingTime = dur;
    pausedAt = Date.now();
    setTimeout(() => {
      if (progressEls[idx] && !paused) {
        progressEls[idx].style.transitionDuration = dur + 'ms';
        progressEls[idx].style.width = '100%';
      }
    }, 50);
    timer = setTimeout(() => show(idx + 1), dur);
  }
  function pause() {
    if (paused) return;
    paused = true;
    clearTimeout(timer);
    remainingTime -= Date.now() - pausedAt;
    $('#pause-story').innerHTML = icon('play', 'w-5 h-5');
    refreshIcons();
  }
  function resume() {
    if (!paused) return;
    paused = false;
    pausedAt = Date.now();
    const el = progressEls[idx];
    if (el) {
      const cs = getComputedStyle(el);
      el.style.width = cs.width;
      el.style.transitionDuration = remainingTime + 'ms';
      setTimeout(() => { el.style.width = '100%'; }, 30);
    }
    $('#pause-story').innerHTML = icon('pause', 'w-5 h-5');
    refreshIcons();
    timer = setTimeout(() => show(idx + 1), remainingTime);
  }
  function close() {
    clearTimeout(timer);
    viewer.remove();
    if (state.activeSection === 'stories') renderSidebarContent();
  }
  $('#close-story', viewer).onclick = close;
  $('#pause-story', viewer).onclick = () => paused ? resume() : pause();
  $('#next-story', viewer).onclick = () => show(idx + 1);
  $('#prev-story', viewer).onclick = () => show(idx - 1);
  viewer.querySelectorAll('[data-avatar-open]').forEach(el => el.onclick = () => { close(); openFullProfile(userId); });
  
  const delBtn = $('#delete-status-btn', viewer);
  if (delBtn) {
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      const st = statuses[idx];
      const choice = confirm(`حذف هذه الحالة؟\n\n"موافق" = حذف هذه فقط\n"إلغاء" = خيارات أخرى`);
      if (choice) {
        try {
          await sb.from('statuses').delete().eq('id', st.id);
          toast('✅ تم حذف الحالة', 'success');
          close();
        } catch (err) { toast('فشل الحذف: ' + err.message, 'error'); }
      } else {
        if (confirm('حذف جميع حالاتك النشطة؟')) {
          try {
            await sb.from('statuses').delete().eq('user_id', state.user.id);
            toast('✅ تم حذف جميع الحالات', 'success');
            close();
          } catch (err) { toast('فشل: ' + err.message, 'error'); }
        }
      }
    };
  }
  
  viewer.querySelectorAll('[data-react]').forEach(btn => {
    btn.onclick = async () => {
      const emoji = btn.dataset.react;
      const st = statuses[idx];
      await addStatusReaction(st.id, emoji);
      const float = document.createElement('div');
      float.textContent = emoji;
      float.style.cssText = `position:fixed;bottom:200px;left:50%;transform:translateX(-50%);font-size:50px;pointer-events:none;z-index:999;`;
      float.classList.add('heart-float');
      document.body.appendChild(float);
      setTimeout(() => float.remove(), 2000);
      toast(`أرسلت ${emoji}`, 'success', 1200);
    };
  });
  
  $('#story-send', viewer).onclick = async () => {
    const reply = $('#story-reply', viewer).value.trim();
    if (!reply) return;
    try {
      let chatId;
      const { data: myChats } = await sb.from('chat_members').select('chat_id, chats:chat_id!inner(type)').eq('user_id', state.user.id).eq('chats.type', 'private');
      const chatIds = (myChats || []).map(m => m.chat_id);
      if (chatIds.length) {
        const { data: theirMem } = await sb.from('chat_members').select('chat_id').eq('user_id', userId).in('chat_id', chatIds);
        if (theirMem?.length) chatId = theirMem[0].chat_id;
      }
      if (!chatId) {
        const { data: chat } = await sb.from('chats').insert({ type: 'private', created_by: state.user.id }).select().single();
        await sb.from('chat_members').insert([
          { chat_id: chat.id, user_id: state.user.id, role: 'owner' },
          { chat_id: chat.id, user_id: userId, role: 'member' }
        ]);
        chatId = chat.id;
      }
      await sendMessage(chatId, `↩ رداً على حالتك: ${reply}`);
      $('#story-reply', viewer).value = '';
      toast('تم إرسال الرد ✓', 'success');
    } catch (e) { toast('فشل الإرسال', 'error'); }
  };
  show(0);
}

function openMemberActionsMenu(parentModal, chat, memberId, memberName, memberRole, myRole) {
  $$('.member-actions-menu').forEach(m => m.remove());
  const menu = document.createElement('div');
  menu.className = 'member-actions-menu context-menu surface border border-soft anim-pop';
  const isOwner = myRole === 'owner';
  const items = [];
  items.push({ icon: 'message-circle', label: 'إرسال رسالة', color: 'text-blue-500', act: async () => { parentModal.remove(); await startPrivateChat(memberId); }});
  items.push({ icon: 'user', label: 'عرض الملف الشخصي', color: 'text-primary', act: () => { parentModal.remove(); openFullProfile(memberId); }});
  if (isOwner) {
    if (memberRole === 'member') {
      items.push({ icon: 'star', label: 'ترقية إلى مشرف', color: 'text-blue-500', act: async () => {
        try {
          const { error } = await sb.from('chat_members').update({ role: 'admin' }).eq('chat_id', chat.id).eq('user_id', memberId);
          if (error) throw error;
          toast('✅ تمت الترقية', 'success');
          parentModal.remove(); await loadChats();
          const updatedChat = state.chats.find(c => c.id === chat.id);
          if (updatedChat) state.activeChat = updatedChat;
          if (state.activeChat) renderChatWindow();
          openChatInfo();
        } catch (e) { toast('فشل: ' + e.message, 'error'); }
      }});
    } else if (memberRole === 'admin') {
      items.push({ icon: 'star-off', label: 'إلغاء صلاحية المشرف', color: 'text-amber-500', act: async () => {
        try {
          const { error } = await sb.from('chat_members').update({ role: 'member' }).eq('chat_id', chat.id).eq('user_id', memberId);
          if (error) throw error;
          toast('✅ تم إلغاء الصلاحية', 'success');
          parentModal.remove(); await loadChats();
          const updatedChat = state.chats.find(c => c.id === chat.id);
          if (updatedChat) state.activeChat = updatedChat;
          if (state.activeChat) renderChatWindow();
          openChatInfo();
        } catch (e) { toast('فشل: ' + e.message, 'error'); }
      }});
    }
  }
  const canRemove = (isOwner && memberRole !== 'owner') || (myRole === 'admin' && memberRole === 'member');
  if (canRemove) {
    items.push({ icon: 'user-minus', label: 'إزالة من المجموعة', color: 'text-red-500', act: async () => {
      if (!confirm(`إزالة "${memberName}"؟`)) return;
      try {
        const { error } = await sb.from('chat_members').delete().eq('chat_id', chat.id).eq('user_id', memberId);
        if (error) throw error;
        toast(`✅ تمت إزالة ${memberName}`, 'success');
        parentModal.remove(); await loadChats();
        const updatedChat = state.chats.find(c => c.id === chat.id);
        if (updatedChat) state.activeChat = updatedChat;
        if (state.activeChat) renderChatWindow();
        openChatInfo();
      } catch (e) { toast('فشل الإزالة: ' + e.message, 'error'); }
    }});
  }
  menu.innerHTML = `<div class="p-1 min-w-[220px]">${items.map((it, i) => `<button data-mi="${i}" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 ${it.color} flex items-center gap-3 text-sm font-medium">${icon(it.icon, 'w-4 h-4')} ${it.label}</button>`).join('')}</div>`;
  const rect = document.querySelector(`[data-member-id="${memberId}"]`)?.getBoundingClientRect() || { bottom: 200, left: 100, width: 40, top: 180 };
  let top = rect.bottom + 5;
  if (top + 300 > window.innerHeight) top = Math.max(10, rect.top - 300);
  let left = rect.left - 220;
  left = Math.max(10, Math.min(window.innerWidth - 230, left));
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  document.body.appendChild(menu);
  refreshIcons();
  menu.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => {
    const it = items[parseInt(b.dataset.mi)];
    menu.remove();
    it.act();
  });
  setTimeout(() => { const close = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } }; document.addEventListener('click', close); }, 100);
}

      filterUsers('');
    } catch (e) {
      console.error('loadAllUsers:', e);
      $('#ulist', modal).innerHTML = `<p class="text-center text-red-500 text-sm py-8">فشل تحميل المستخدمين</p>`;
    }
  }
  
  function filterUsers(q) {
    searchQuery = q;
    const term = q.trim().toLowerCase();
    if (!term) {
      filteredUsers = allUsers;
    } else {
      const cleanTerm = term.startsWith('@') ? term.substring(1) : term;
      filteredUsers = allUsers.filter(u => {
        const fullName = (u.full_name || '').toLowerCase();
        const username = (u.username || '').toLowerCase();
        return fullName.includes(cleanTerm) || username.includes(cleanTerm);
      });
    }
    renderUsers();
    updateSearchInfo();
  }
  
  function updateSearchInfo() {
    const info = $('#search-info', modal);
    const clearBtn = $('#clear-search', modal);
    if (searchQuery.trim()) {
      info.textContent = `${filteredUsers.length} نتيجة للبحث "${searchQuery}"`;
      info.classList.remove('hidden');
      clearBtn.classList.remove('hidden');
    } else {
      info.classList.add('hidden');
      clearBtn.classList.add('hidden');
    }
  }
  
  function renderUsers() {
    const list = $('#ulist', modal);
    if (!filteredUsers.length) {
      if (searchQuery.trim()) {
        list.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-3 opacity-20">🔍</div><p class="text-muted text-sm">لا نتائج للبحث "${esc(searchQuery)}"</p><p class="text-muted text-xs mt-1 opacity-70">تأكد من كتابة الاسم أو @يوزر بشكل صحيح</p></div>`;
      } else {
        list.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-3 opacity-20">👥</div><p class="text-muted text-sm">لا يوجد مستخدمون آخرون</p></div>`;
      }
      return;
    }
    list.innerHTML = filteredUsers.map(u => {
      const alreadyMember = currentMemberIds.has(u.id);
      const isSelected = selected.has(u.id);
      return `
        <button data-uid="${u.id}" class="user-row w-full p-3 rounded-xl flex items-center gap-3 transition mb-1 ${alreadyMember ? 'opacity-40 cursor-not-allowed' : isSelected ? 'bg-blue-500/10 border border-blue-500/30' : 'hover:bg-black/5 dark:hover:bg-white/5 border border-transparent'}">
          <div class="relative w-11 h-11 rounded-full flex items-center justify-center text-white font-bold overflow-hidden flex-shrink-0" style="background: ${u.avatar_url ? 'transparent' : avGrad(u.id)};">
            ${u.avatar_url ? `<img src="${esc(u.avatar_url)}" class="w-full h-full object-cover" />` : esc((u.full_name || '?')[0])}
            ${u.is_online ? `<span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-800"></span>` : ''}
          </div>
          <div class="flex-1 text-right min-w-0">
            <div class="flex items-center gap-2">
              <p class="text-primary font-bold text-sm truncate">${esc(u.full_name)}</p>
              ${alreadyMember ? `<span class="text-[9px] bg-slate-500/20 text-muted px-1.5 py-0.5 rounded-full font-bold flex-shrink-0">موجود</span>` : ''}
            </div>
            <p class="text-muted text-xs truncate">@${esc(u.username)}</p>
          </div>
          ${!alreadyMember ? `<div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSelected ? 'bg-blue-500 border-blue-500' : 'border-slate-300 dark:border-slate-600'}">${isSelected ? icon('check', 'w-4 h-4 text-white') : ''}</div>` : ''}
        </button>`;
    }).join('');
    list.querySelectorAll('.user-row').forEach(row => {
      const uid = row.dataset.uid;
      if (currentMemberIds.has(uid)) return;
      row.onclick = () => {
        if (selected.has(uid)) selected.delete(uid); else selected.add(uid);
        renderUsers();
        updateBtn();
      };
    });
    refreshIcons();
  }
  
  function updateBtn() {
    const btn = $('#btn-add', modal);
    const countEl = $('#selected-count', modal);
    const textEl = $('#btn-add-text', modal);
    if (selected.size === 0) {
      btn.disabled = true;
      countEl.classList.add('hidden');
      textEl.textContent = 'إضافة المحددين';
    } else {
      btn.disabled = false;
      countEl.textContent = `تم تحديد ${selected.size} ${selected.size === 1 ? 'عضو' : 'أعضاء'}`;
      countEl.classList.remove('hidden');
      textEl.textContent = `إضافة ${selected.size} عضو`;
    }
  }
  
  const searchInput = $('#usearch', modal);
  let searchTimeout;
  searchInput.oninput = () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { filterUsers(searchInput.value); }, 150);
  };
  searchInput.focus();
  
  $('#clear-search', modal).onclick = () => {
    searchInput.value = '';
    filterUsers('');
    searchInput.focus();
  };
  
  $('#btn-add', modal).onclick = async () => {
    if (selected.size === 0) return;
    const btn = $('#btn-add', modal);
    btn.disabled = true;
    $('#btn-add-text', modal).textContent = 'جارٍ الإضافة...';
    try {
      const members = [...selected].map(uid => ({ chat_id: chatId, user_id: uid, role: 'member' }));
      const { error } = await sb.from('chat_members').insert(members);
      if (error) {
        if (error.code === '23505') {
          let addedCount = 0;
          for (const member of members) {
            const { error: singleErr } = await sb.from('chat_members').insert(member);
            if (!singleErr) addedCount++;
          }
          if (addedCount === 0) throw new Error('كل الأعضاء موجودون بالفعل');
          toast(`✅ تمت إضافة ${addedCount} عضو`, 'success');
        } else throw error;
      } else {
        toast(`✅ تمت إضافة ${selected.size} عضو`, 'success');
      }
      modal.remove();
      await loadChats();
      const updatedChat = state.chats.find(c => c.id === chatId);
      if (updatedChat) {
        state.activeChat = updatedChat;
        if (state.activeChat) { renderChatWindow(); renderChatList(); }
      }
    } catch (e) {
      console.error('add members:', e);
      toast('فشل الإضافة: ' + (e.message || 'خطأ'), 'error');
      btn.disabled = false;
      $('#btn-add-text', modal).textContent = `إضافة ${selected.size} عضو`;
    }
  };
  loadAllUsers();
}

// ============================================================
//  EDIT CHAT MODAL
// ============================================================
async function openEditChatModal(chatId) {
  const chat = state.chats.find(c => c.id === chatId);
  if (!chat) return;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4 anim-fade';
  modal.innerHTML = `
    <div class="w-full max-w-md surface rounded-2xl shadow-2xl border border-soft overflow-hidden anim-slide">
      <div class="p-4 border-b border-soft flex items-center justify-between">
        <h3 class="text-primary font-bold text-lg">تعديل ${chat.type === 'channel' ? 'القناة' : 'المجموعة'}</h3>
        <button data-close class="text-muted hover:text-primary p-1">${icon('x', 'w-5 h-5')}</button>
      </div>
      <div class="p-4 space-y-4">
        <div class="flex justify-center">
          <label class="relative cursor-pointer group">
            <div class="w-24 h-24 rounded-full flex items-center justify-center text-white text-3xl font-bold overflow-hidden shadow-lg" style="background: ${chat.avatar_url ? 'transparent' : avGrad(chat.id)};">
              ${chat.avatar_url ? `<img src="${esc(chat.avatar_url)}" class="w-full h-full object-cover" />` : esc((chat.name || '?')[0])}
            </div>
            <div class="absolute inset-0 rounded-full bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">${icon('camera', 'w-6 h-6 text-white')}</div>
            <input id="chat-av-in" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div><label class="text-muted text-xs font-bold">الاسم</label><input id="chat-name" type="text" value="${esc(chat.name || '')}" maxlength="60" class="w-full mt-1 px-4 py-3 rounded-xl surface-2 border border-soft text-primary focus:outline-none focus:ring-2 focus:ring-blue-500/50" /></div>
        <div><label class="text-muted text-xs font-bold">الوصف</label><textarea id="chat-desc" rows="3" maxlength="200" class="w-full mt-1 px-4 py-3 rounded-xl surface-2 border border-soft text-primary placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 resize-none">${esc(chat.description || '')}</textarea></div>
        <button id="chat-save" class="w-full py-3 gradient-btn text-white font-bold rounded-xl">حفظ</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  refreshIcons();
  modal.querySelector('[data-close]').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  $('#chat-av-in', modal).onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('الصورة كبيرة (5MB)', 'error');
    showUploadProgress('رفع الصورة...');
    try {
      const url = await uploadFile(file, 'chat-media');
      const { error } = await sb.from('chats').update({ avatar_url: url }).eq('id', chatId);
      if (error) throw error;
      toast('✅ تم تحديث الصورة', 'success');
      modal.remove(); await loadChats();
      const updatedChat = state.chats.find(c => c.id === chatId);
      if (updatedChat) state.activeChat = updatedChat;
      if (state.activeChat) renderChatWindow();
      openChatInfo();
    } catch (err) { console.error(err); toast(err.message, 'error'); }
    finally { hideUploadProgress(); }
  };
  $('#chat-save', modal).onclick = async () => {
    const name = $('#chat-name', modal).value.trim();
    const desc = $('#chat-desc', modal).value.trim();
    if (!name) return toast('الاسم مطلوب', 'error');
    const btn = $('#chat-save', modal);
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    try {
      const { error } = await sb.from('chats').update({ name, description: desc || null }).eq('id', chatId);
      if (error) throw error;
      toast('✅ تم الحفظ', 'success');
      modal.remove(); await loadChats();
      const updatedChat = state.chats.find(c => c.id === chatId);
      if (updatedChat) state.activeChat = updatedChat;
      if (state.activeChat) renderChatWindow();
      openChatInfo();
    } catch (e) { console.error(e); toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'حفظ'; }
  };
}

function openChatMenu() {
  const chat = state.activeChat;
  if (!chat) return;
  const items = [
    { icon: 'info', label: 'معلومات', act: openChatInfo },
    { icon: 'trash-2', label: 'مسح المحادثة', act: async () => { if (!confirm('مسح كل الرسائل؟')) return; await sb.from('messages').delete().eq('chat_id', chat.id); await loadMessages(chat.id); renderMessages(); await loadChats(); toast('تم المسح ✓', 'success'); }, danger: true }
  ];
  const menu = document.createElement('div');
  menu.className = 'msg-menu context-menu surface border border-soft anim-pop';
  menu.style.top = '60px'; menu.style.left = '20px';
  menu.innerHTML = `<div class="p-1">${items.map((it, i) => `<button data-i="${i}" class="w-full p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 ${it.danger ? 'text-red-500' : 'text-primary'} flex items-center gap-3 text-sm font-medium">${icon(it.icon, 'w-4 h-4')} ${it.label}</button>`).join('')}</div>`;
  document.body.appendChild(menu);
  refreshIcons();
  menu.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const it = items[parseInt(b.dataset.i)]; menu.remove(); it.act(); });
  setTimeout(() => { const close = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } }; document.addEventListener('click', close); }, 100);
}

// ============================================================
//  START PRIVATE CHAT
// ============================================================
async function startPrivateChat(otherId) {
  try {
    await ensureFriendship(otherId);
    const { data: myChats } = await sb.from('chat_members').select('chat_id, chats:chat_id!inner(id, type)').eq('user_id', state.user.id).eq('chats.type', 'private');
    if (myChats?.length) {
      const chatIds = myChats.map(m => m.chat_id);
      const { data: theirMem } = await sb.from('chat_members').select('chat_id').eq('user_id', otherId).in('chat_id', chatIds);
      if (theirMem?.length) {
        await loadChats();
        state.activeSection = 'chats'; renderBottomNav(); renderNavRail(); renderSidebarContent();
        openChat(theirMem[0].chat_id);
        return;
      }
    }
    const { data: chat, error } = await sb.from('chats').insert({ type: 'private', created_by: state.user.id }).select().single();
    if (error) throw error;
    const { error: memErr } = await sb.from('chat_members').insert([
      { chat_id: chat.id, user_id: state.user.id, role: 'owner' },
      { chat_id: chat.id, user_id: otherId, role: 'member' }
    ]);
    if (memErr) { await sb.from('chats').delete().eq('id', chat.id); throw memErr; }
    await loadChats();
    state.activeSection = 'chats'; renderBottomNav(); renderNavRail(); renderSidebarContent();
    openChat(chat.id);
  } catch (e) { console.error('startPrivateChat:', e); toast('فشل بدء المحادثة: ' + e.message, 'error'); }
}

// ============================================================
//  LOGOUT
// ============================================================
async function doLogout() {
  if (!confirm('تسجيل الخروج؟')) return;
  await endCall(true);
  await signOut();
  renderAuth();
}

// ============================================================
//  INIT
// ============================================================
window.addEventListener('DOMContentLoaded', boot);
window.addEventListener('resize', () => {
  if (window.innerWidth >= 768) {
    $('#sidebar')?.classList.remove('hidden-mobile');
    if (state.activeChat) $('#chat-window')?.classList.remove('hidden');
  }
  renderNavRail();
});
window.addEventListener('beforeunload', () => { if (state.currentCall) endCall(true); });
</script>
